<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Khedma - منصة الخدمات الرقمية</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f8fc;--card:#fff;--ink:#0d1620;--mute:#5a6b7b;--line:#dce6ef;--acc:#0078ba;--accfg:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1219;--card:#121c26;--ink:#eef4fa;--mute:#93a4b4;--line:#223140;--acc:#28b6e9;--accfg:#04121c}}
:root[data-theme="dark"]{--bg:#0b1219;--card:#121c26;--ink:#eef4fa;--mute:#93a4b4;--line:#223140;--acc:#28b6e9;--accfg:#04121c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6;background-image:linear-gradient(180deg,color-mix(in srgb,var(--acc) 10%,transparent),transparent 260px);background-repeat:no-repeat}
.w{max-width:960px;margin:0 auto;padding:14px 16px 40px}
.nav{display:flex;justify-content:space-between;align-items:center;direction:ltr}
.lw img{height:56px;width:auto}.lg-l{display:block}.lg-d{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lg-l{display:none}:root:not([data-theme="light"]) .lg-d{display:block}}
:root[data-theme="dark"] .lg-l{display:none}:root[data-theme="dark"] .lg-d{display:block}
h1{font-size:26px;margin:18px 0 6px}h2{font-size:19px;margin:28px 0 12px}
.sub{color:var(--mute);margin:0 0 14px}
.btn{display:inline-block;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;background:var(--acc);color:var(--accfg)}
.btn.o{background:transparent;color:var(--acc);border:1px solid var(--acc)}.btn.g{background:#16a34a;color:#fff}
.sr{width:100%;padding:14px 16px;font:inherit;font-size:16px;border:2px solid var(--acc);border-radius:12px;background:var(--card);color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0}
.chip{flex:none;padding:8px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;font:inherit;cursor:pointer}
.chip.on{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}
.card h3{margin:0;font-size:17px}.card p{margin:0;color:var(--mute);font-size:14px}
.ic{font-size:30px}.pr{color:var(--acc);font-weight:800}.mt{font-size:13px;color:var(--mute)}
.bt{display:flex;gap:8px;margin-top:auto;padding-top:8px}.bt .btn{flex:1;text-align:center;padding:9px 6px;font-size:14px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.n{width:30px;height:30px;border-radius:50%;background:var(--acc);color:var(--accfg);display:grid;place-items:center;font-weight:800}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 6px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.ck{display:flex;gap:8px;align-items:center;color:var(--ink)}.ck input{width:auto}
ul.l{padding-inline-start:20px;margin:0}
.dt .hd{display:flex;gap:14px;align-items:center}.dt h1{margin:2px 0 0;font-size:24px}.dt h2{font-size:17px;margin:22px 0 10px}
.tag{display:inline-block;font-size:12px;color:var(--acc);border:1px solid var(--acc);border-radius:999px;padding:0 10px}
.info{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.info div,.tb div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.info span,.tb span{display:block;font-size:12px;color:var(--mute)}.info b,.tb b{color:var(--acc);font-size:14px}
.tb{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.ck2{list-style:none;padding:0;margin:0;display:grid;gap:8px}.ck2 li{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.ck2 li:before{content:"\2713";color:var(--acc);font-weight:800;margin-inline-end:8px}
.big{font-size:26px;font-weight:800;color:var(--acc)}.er{color:#dc2626;font-size:14px;margin-top:8px}
a.back{color:var(--acc);text-decoration:none;display:inline-block;margin:14px 0}
</style>
</head>

 return '<a class="back" href="#/">← كل الخدمات</a><div class="box dt"><div class="hd"><div class="ic">'+IC[s.c]+'</div><div><span class="tag">'+cn(s.c)+'</span><h1>'+s.n+'</h1></div></div><p class="sub">'+s.d+'</p>'+
 '<div class="info"><div><span>'+pp[0]+'</span><b>'+pp[1]+'</b></div><div><span>مدة التنفيذ</span><b>'+DUR[s.c]+'</b></div><div><span>عدد التعديلات</span><b>'+REV[s.c]+'</b></div></div>'+
 (s.t?'<h2>الأسعار حسب المدة</h2><div class="tb">'+s.t.map(function(x){return '<div><span>'+x[0]+'</span><b>'+x[1]+' ج.م</b></div>'}).join("")+'</div>':"")+
 '<h2>اللي هتحصل عليه</h2><ul class="ck2">'+s.g.map(function(x){return '<li>'+x+'</li>'}).join("")+'</ul>'+
 '<a class="btn" style="display:block;text-align:center;margin-top:22px" href="#/o/'+s.id+'">اطلب الآن</a></div>'}
function ord(s){return '<a class="back" href="#/s/'+s.id+'">← تفاصيل الخدمة</a><div class="box"><h1 style="margin:0 0 4px">طلب خدمة</h1>'+
 '<label>اسمك</label><input id="nm" autocomplete="name"><label>الخدمة المطلوبة</label><select id="sv" onchange="location.hash=\'#/o/\'+this.value">'+S.map(function(x){return '<option value="'+x.id+'"'+(x.id===s.id?' selected':'')+'>'+x.n+'</option>'}).join("")+'</select>'+
 (s.t?'<label>المدة</label><select id="ti" onchange="est()">'+s.t.map(function(x,i){return '<option value="'+i+'">'+x[0]+' — '+x[1]+' ج.م</option>'}).join("")+'</select>':'')+
 '<label>الكمية'+(s.u?' ('+s.u+')':'')+'</label><input type="number" id="qy" min="1" value="1" oninput="est()">'+
 (s.c==="tx"&&s.p?'<div class="ck" style="margin-top:12px"><input type="checkbox" id="wd" onchange="est()"><span>تفريغ + تنسيق Word (+50 ج.م)</span></div>':'')+
 '<div class="ck" style="margin-top:12px"><input type="checkbox" id="rs" onchange="est()"><span>تسليم سريع (+'+RUSH+' ج.م)</span></div>'+
 '<label>وصف المشروع</label><textarea id="ds" rows="4" placeholder="اكتب اللي عايزه بالتفصيل"></textarea><label>الميزانية</label><input id="bg" placeholder="مثال: 500 ج.م"><label>الموعد المطلوب</label><input type="date" id="dl">'+
 '<label>رفع ملفات أو صور</label><input type="file" id="fl" multiple><div class="mt">أسماء الملفات بتتكتب في الطلب، وابعت الملفات نفسها في محادثة واتساب بعد فتحها.</div>'+
 '<label>رقم الواتساب بتاعك</label><input type="tel" id="ph" placeholder="01xxxxxxxxx"><div class="big" id="es" style="margin-top:16px"></div><div class="er" id="er"></div>'+
 '<button class="btn g" style="width:100%;margin-top:12px" onclick="send()">إرسال الطلب على واتساب</button></div>'}
function est(){var s=cur;if(!s.p){$("es").textContent="السعر هيتحدد حسب اللغة والمدة بعد التواصل";return}
 var p=s.t?s.t[+$("ti").value][1]:s.p,t=p*Math.max(1,+$("qy").value||1);
 if($("wd")&&$("wd").checked)t+=50;if($("rs").checked)t+=RUSH;
 $("es").textContent=(s.f&&!s.t?"التكلفة التقديرية تبدأ من ":"الإجمالي: ")+t+" ج.م"}
function send(){var s=cur,nm=$("nm").value.trim(),ph=$("ph").value.trim();
 if(!nm||!ph){$("er").textContent="اكتب اسمك ورقم الواتساب.";return}
 var ex=[];if($("wd")&&$("wd").checked)ex.push("تنسيق Word");if($("rs").checked)ex.push("تسليم سريع");
 var fl=[].map.call($("fl").files,function(f){return f.name}).join("، ");
 var m=["طلب جديد من موقع Khedma","الاسم: "+nm,"واتساب العميل: "+ph,"الخدمة: "+s.n+(s.t?" ("+s.t[+$("ti").value][0]+")":"")+" × "+Math.max(1,+$("qy").value||1),
  ex.length?"إضافات: "+ex.join("، "):"","وصف المشروع: "+($("ds").value.trim()||"-"),"الميزانية: "+($("bg").value.trim()||"-"),"الموعد المطلوب: "+($("dl").value||"-"),
  "الملفات: "+(fl?fl+" (هبعتها هنا في الشات)":"مفيش"),$("es").textContent].filter(Boolean).join("\n");
 window.open(wa(m),"_blank")||(location.href=wa(m))}
function route(){var h=location.hash.replace("#/","").split("/"),a=$("app"),s=S.filter(function(x){return x.id===h[1]})[0];window.scrollTo(0,0);
 if(h[0]==="s"&&s)a.innerHTML=det(s);else if(h[0]==="o"&&s){cur=s;a.innerHTML=ord(s);est()}else{a.innerHTML=home();res()}}
$("cw").href=wa("أهلاً Khedma");
window.addEventListener("hashchange",route);route();
</script>
</body>
</html>
